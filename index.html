<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e3d3" />
    <meta
      name="description"
      content="『老人と海』 石波杏訳・CC BY 2.1 JP"
    />
    <title>老人と海</title>
  </head>
  <body>
    <header class="reader-bar" aria-label="読書ナビゲーション">
      <a class="reader-brand" href="#top" aria-label="ページの先頭へ">
        <span class="reader-brand-mark" aria-hidden="true">海</span>
        <span>老人と海</span>
      </a>
      <div class="reader-position" aria-live="polite">
        <strong id="reader-percent">0%</strong>
      </div>
      <div class="reader-progress" aria-hidden="true"><i id="reader-progress-fill"></i></div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span id="motion-label">浮動を止める</span>
      </button>
    </header>

    <main id="app"></main>

    <div class="segment-meter" id="segment-meter" aria-hidden="true">
      <span>FLUID FRAGMENT</span>
      <b id="active-segments">0 / 0</b>
      <small>MOVED / ACTIVE</small>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
