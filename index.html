<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e3d3" />
    <meta
      name="description"
      content="カーソルとスクロールが潮流を生み、言葉が漂う『老人と海』の一枚読み。石波杏訳・CC BY 2.1 JP。"
    />
    <title>老人と海｜潮の記憶</title>
  </head>
  <body>
    <header class="reader-bar" aria-label="読書ナビゲーション">
      <a class="reader-brand" href="#top" aria-label="ページの先頭へ">
        <span class="reader-brand-mark" aria-hidden="true">潮</span>
        <span>潮の記憶</span>
      </a>
      <div class="reader-position" aria-live="polite">
        <span id="reader-phase">岸辺</span>
        <strong id="reader-percent">0%</strong>
      </div>
      <div class="reader-progress" aria-hidden="true"><i id="reader-progress-fill"></i></div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span class="motion-dot" aria-hidden="true"></span>
        <span id="motion-label">潮流を止める</span>
      </button>
    </header>

    <main id="app"></main>

    <div class="segment-meter" id="segment-meter" aria-hidden="true">
      <span>FLUID FIELD</span>
      <b id="active-segments">0</b>
      <small>VISIBLE SEGMENTS</small>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
